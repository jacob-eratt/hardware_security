[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpl"
version = "0.1.0"
description = "Learning cache replacement policies with neural sequence models"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "pandas", "pyarrow", "pyyaml", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
