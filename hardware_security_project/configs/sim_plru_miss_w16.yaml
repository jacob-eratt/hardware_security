seed: 1234
target: sim_plru_miss_W16
policy: plru
W: 16
data:
  out_dir: data/processed/sim_plru_miss_W16
  # Each history is drawn from blocks b0..b(P-1), P ~ U[16, 24]: P = 16 is hits-only,
  # larger P adds misses. Same histories as sim_drrip_w16.yaml (same seed, pool, sizes).
  pool_range: [16, 24]
  sizes: {train: 500000, val: 25000, test: 25000, test_long: 25000, test_xlong: 10000}   # histories (1 row each)
  len_ranges: {train: [0, 32], test_long: [33, 128], test_xlong: [129, 512]}
model:
  d_emb: 32
  hidden: 128
  layers: 2
  dropout: 0.0
train:
  batch_size: 512
  lr: 1.0e-3
  betas: [0.9, 0.999]
  weight_decay: 0.01
  warmup_steps: 500
  min_lr: 1.0e-5
  max_epochs: 10
  grad_clip: 1.0
  eval_every: 2000
  curriculum: {start_len: 8, step: 8, max_len: 32}
  early_stop_acc: 0.999
  early_stop_patience: 2
  device: auto
noise: null
